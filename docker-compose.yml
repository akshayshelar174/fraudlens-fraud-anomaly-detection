services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: ["uvicorn", "fraudlens.api:app", "--host", "0.0.0.0", "--port", "8000"]
  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0"]
    depends_on:
      - api
